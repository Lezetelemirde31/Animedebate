# Render Blueprint: creates the web service and its PostgreSQL database.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: anime-auction
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: anime-auction-db
          property: connectionString

databases:
  - name: anime-auction-db
    plan: free
    databaseName: anime_auction
    user: anime
